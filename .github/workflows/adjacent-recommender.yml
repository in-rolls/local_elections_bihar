name: Find Adjacent Repositories

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adjacent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recommend-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Adjacent Repositories Recommender
        id: adjacent
        uses: gojiplus/adjacent@a2f97a586c48d941f493a1f75af07b0b95dceff8 # v2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        if: steps.adjacent.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update adjacent repositories [automated]"
          git pull --rebase
          git push
