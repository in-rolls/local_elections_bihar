    <script>
        function ShowMessage(message, messagetype, url) {
            //document.getElementById('cardProcessing').style.display = 'none';
            $("#cardProcessing").hide();
            var toTitleCase = function (str) {
                str = str.toLowerCase().split(' ');
                for (var i = 0; i < str.length; i++) {
                    str[i] = str[i].charAt(0).toUpperCase() + str[i].slice(1);
                }
                return str.join(' ');
            };
            if (url == "") {
                url = "javascript:;";
            }
            switch (messagetype) {
                case 'success':
                    swal({
                        title: toTitleCase(messagetype) + " !",
                        text: message,
                        icon: messagetype,
                        button: "OK",
                    }).then(function () {
                        window.parent.location.href = url;
                    });

                    break;
                case 'Error':
                    swal({
                        title: toTitleCase(messagetype) + " !",
                        text: message,
                        icon: messagetype,
                        button: "OK",
                    }).then(function () {
                        window.location = url;
                    });
                    break;
                case 'Warning':
                    swal({
                        title: toTitleCase(messagetype) + " !",
                        text: message,
                        icon: messagetype,
                        button: "OK",
                    }).then(function () {
                        window.location = url;
                    });
                    break;
                default:
                    swal({
                        title: toTitleCase(messagetype) + " !",
                        text: message,
                        icon: messagetype,
                        button: "OK",
                    }).then(function () {
                        window.location = url;
                    });
            }

        };
    </script>

    <script type="text/javascript">       
        $(function () {
            $("#btnshow").click(function () {
                $("#cardProcessing").show();
                $("#mainForm").parsley().validate();
                if (!$('#mainForm').parsley().isValid()) { $("#cardProcessing").hide(); return; }
                const district_id = $("#ddlDistrict").val();  
                const subdivision_id = -1;  
                var npid = $("#ddlNagarNikayName").val();  
                if (!npid) {
                    npid = -1;
                }
                var post_id = $("#ddlPosts").val();
                if (!post_id) {
                    post_id = -1;
                }
                $.ajax({
                    type: "POST",
                    url: "WinningCandidatesPost_Wise.aspx/GetWinningCandidtes",
                    data: '{district_id:' + district_id + ', subdivision_id: ' + subdivision_id + ', post_id:' + post_id + ', npid:' + npid + '}',
                    contentType: "application/json; charset=utf-8",
                    dataType: "json",
                    success: OnSuccess,
                    failure: function (response) {
                        //alert(response.d);
                        $("#cardProcessing").hide();
                    },
                    error: function (response) {
                        //alert(response.d);
                        $("#cardProcessing").hide();
                    }
                });                
            });
        });
        function OnSuccess(response) {
            $("#cardTable").show();
            $("#cardProcessing").hide();
            var candidates = JSON.parse(response.d); 
            console.log(candidates);
            const dt = $("#dvCandidates table").DataTable();
            dt.clear().draw();
            candidates.map((cand, index) => {     
                var fold = '';
                if (cand.Phase == 2) {
                    fold = '2';
                }
                else {
                    fold = '';
                }
                dt.row.add([
                    `${index + 1}`,
                    `${cand.post}`,
                    `${cand.DistrictNameHn}`,
                    `${cand.NPNameHn}`,
                    `${cand.post_id == 3 ? cand.wardno == '73' ? '22A' : cand.wardno == '74' ? '22B' : cand.wardno == '75' ? '22C' : cand.wardno : ''}`,
                    `${cand.ReservedFor.split('_')[0]}`,
                    //`${cand.ReservedFor.split('_')[1]}`,
                    `${cand.name_hn}`,
                    `${cand.guardian_name_hn}`,
                    `${cand.gender}`,
                    `${cand.age}`,
                    `${cand.cname}`,
                    `${cand.address}`,
                    `${cand.mobile}`,
                    `<img src="http://sec2021.bihar.gov.in/ForPublicPdf/SEC_Nomination${fold}/Uploads/${cand.user_id}/photo.jpeg" width="56" />`,
                    `<a href="http://sec2021.bihar.gov.in/ForPublicPdf/SEC_Nomination${fold}/Uploads/${cand.user_id}/${cand.NomID}/Documents/aff_prapatra_kh.pdf" target="_blank">Affidavit</a>`]
                ).draw(false);
            })
            //$("#ctbody").html(candidatesData);
        }
       
    </script>

    <script>
        function printPrapatraCHH(nid) {
            $.ajax({
                type: "Post",
                contentType: "application/json; charset=utf-8",
                url: "WinningCandidates.aspx/GetWinningCandidtes",
                data: '{nid: ' + nid + ', prapatra: ' + 11 + '}',
                dataType: "json",
                success: function (data) {
                    var printContents = data.d;
                    var originalContents = document.body.innerHTML;
                    document.body.innerHTML = printContents;
                    setTimeout(() => {
                        window.print();
                        document.body.innerHTML = originalContents;
                    }, 1000);
                },
                error: function () {

                    swal("Error while printing prapatra!", "Error ", "error");
                }
            });
        }
    </script>

                    $('#ddlNagarNikayName option:first').val('-1');

                if ($('#ddlNagarNikayName > option').length > 1) {
                    $('#ddlNagarNikayName option:first').text('Select');
                    $('#ddlNagarNikayName option:first').val('');
                    $("#ddlNagarNikayName").selectpicker("refresh");
                    $('#ddlNagarNikayName').prop('required', true);

            }
