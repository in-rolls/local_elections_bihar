[project]
name = "local-elections-bihar"
version = "1.0.0"
description = "Bihar panchayat seat reservations, candidates and election outcomes across general elections and by-elections"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Bihar", "elections", "panchayats", "reservation", "data"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fonttools>=4",
    "pandera[polars]>=0.33",
    "pdfplumber>=0.11",
    "pillow>=12.3.0",
    "polars>=1.44",
    "pyarrow>=21",
    "pypdf>=6",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "xlrd>=2",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_bihar"
Issues = "https://github.com/in-rolls/local_elections_bihar/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_bihar"]

[dependency-groups]
dev = ["ruff>=0.14", { include-group = "test" }]
test = ["pytest>=8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
allowed-confusables = ["‘", "’", "‛", "–"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
